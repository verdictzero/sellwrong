<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grocery Sim">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Grocery Store Simulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2308090d'/%3E%3Cpath d='M8 2c1 3 3 3 3 6a3 3 0 0 1-6 0c0-2 1-2 1-4 1 1 1 2 2 2 0-2-1-3 0-4z' fill='%23e8621a'/%3E%3Cpath d='M8 7c.6 1.4 1.4 1.6 1.4 3A1.4 1.4 0 0 1 6.6 10c0-1.2.8-1.4 1.4-3z' fill='%23ffe07a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<!-- Three r160, vendored rather than fetched from a CDN, so the game
     runs off a memory stick. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>

<div id="game"></div>

<!-- The phone's controls. Hidden until the game is being played by
     touch; touch.js does everything else. -->
<div id="touch" hidden>
  <div class="hint hint-move"><span>MOVE</span></div>
  <div class="hint hint-look">DRAG TO LOOK</div>
  <div class="stick"><div class="knob"></div></div>
  <div class="tb tb-use" data-btn="use" role="button" aria-label="Use">USE</div>
  <div class="tb tb-fire" data-btn="fire" role="button" aria-label="Flamethrower — hold to burn, drag to sweep">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2c1 3 3 3 3 6a3 3 0 0 1-6 0c0-2 1-2 1-4 1 1 1 2 2 2 0-2-1-3 0-4z" fill="#e8621a"/><path d="M8 7c.6 1.4 1.4 1.6 1.4 3A1.4 1.4 0 0 1 6.6 10c0-1.2.8-1.4 1.4-3z" fill="#ffe07a"/></svg>
  </div>
  <div class="tb tb-pause" data-btn="pause" role="button" aria-label="Pause"><i></i><i></i></div>
</div>

<div id="rotate">TURN YOUR PHONE SIDEWAYS FOR THE FULL VIEW</div>

<!-- Loading: the name, a line, and a bar. -->
<div id="loading">
  <div class="panel">
    <div class="logo-slot small">
    <svg class="logo" viewBox="0 0 700 190" role="img" aria-label="Grocery Store Simulator">
      <g transform="skewX(-11)">
        <text class="l1" x="60" y="64" textLength="600" lengthAdjust="spacing">GROCERY STORE</text>
        <text class="l2" x="60" y="164" textLength="600" lengthAdjust="spacing">SIMULATOR</text>
      </g>
    </svg>
    </div>
    <div id="load-status">STARTING</div>
    <div class="bar"><div id="load-bar"></div></div>
  </div>
</div>

<!-- The title: the name over the car park, and a way in. The picture
     behind it is the game itself, standing still. Nothing else. -->
<div id="title" class="gone">
  <div class="panel">
    <div class="logo-slot">
    <svg class="logo" viewBox="0 0 700 190" role="img" aria-label="Grocery Store Simulator">
      <g transform="skewX(-11)">
        <text class="l1" x="60" y="64" textLength="600" lengthAdjust="spacing">GROCERY STORE</text>
        <text class="l2" x="60" y="164" textLength="600" lengthAdjust="spacing">SIMULATOR</text>
      </g>
    </svg>
    </div>
    <p class="prompt"><span class="desk-only">CLICK TO START</span><span class="touch-only">TAP TO START</span></p>
  </div>
</div>

<!-- Paused: a short column of small words. -->
<div id="pause" class="gone">
  <div class="panel menu">
    <h2>PAUSED</h2>
    <div class="row">
      <button id="btn-resume" class="btn primary">RESUME</button>
      <button id="btn-restart" class="btn quiet">RESTART</button>
    </div>
    <label class="row slider" for="opt-sens">
      <span>LOOK SPEED</span>
      <input id="opt-sens" type="range" min="0.4" max="2.4" step="0.1" value="1">
      <b id="opt-sens-v">1.0X</b>
    </label>
    <div class="row">
      <button id="opt-invert" class="btn tog" aria-pressed="false">INVERT LOOK</button>
      <button id="opt-lefty" class="btn tog touch-only" aria-pressed="false">LEFT-HANDED</button>
      <button id="opt-haptic" class="btn tog touch-only" aria-pressed="true">VIBRATION</button>
    </div>
    <div class="row">
      <button id="opt-detail" class="btn">DETAIL 400P</button>
      <button id="opt-full" class="btn" hidden>FULLSCREEN</button>
    </div>
  </div>
</div>

<div id="fps" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
