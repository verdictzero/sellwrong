# The same two jobs as .gitlab-ci.yml, for the place the repository
# actually lives. Both call tools/build-site.sh, so there is one
# definition of what the site is and no chance of the two drifting.
name: test and publish

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

env:
  # WHICH BRANCH IS THE PREVIEW. The site publishes twice: the root is
  # main, and /dev is whatever this names — so there is somewhere to look
  # at a change before it is somebody's front page. Point it at another
  # branch to preview that one instead; if the branch is gone, /dev is
  # simply not built and the root publishes as it always did.
  DEV_REF: claude/american-town-expansion-plan-9bv2pm

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: smoke test
        run: node tools/smoke-test.mjs
      - name: art is in step with art/
        run: |
          cp js/art-data.js /tmp/art-data.committed.js
          node tools/bake-art.mjs
          if ! diff -q /tmp/art-data.committed.js js/art-data.js > /dev/null; then
            echo "js/art-data.js is stale — art/ has changed since it was baked."
            echo "Run: node tools/bake-art.mjs   and commit the result."
            exit 1
          fi

  publish:
    needs: test
    # main publishes the root; a claude/ branch publishes because it is
    # what /dev is for. The env context is not available in a job-level
    # if, so this is the shape of the name rather than DEV_REF itself.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # THE ROOT IS ALWAYS MAIN, whichever branch set this run going. A
      # Pages deployment replaces the whole site, so a preview cannot be
      # published on its own without taking the front page down with it.
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: assemble the site
        run: sh tools/build-site.sh public
      # AND /dev IS THE PREVIEW BRANCH, assembled by its OWN copy of
      # build-site.sh — so a branch that changes what the site is made of
      # is previewed with that change in it. Nothing in the page is
      # addressed from the site root, so it runs from a subdirectory
      # without knowing it is in one.
      - continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEV_REF }}
          path: dev-src
      - name: and the preview at /dev
        run: |
          if [ -f dev-src/tools/build-site.sh ]; then
            sh dev-src/tools/build-site.sh "$PWD/public/dev"
            rm -rf dev-src
          else
            echo "no ${DEV_REF} branch to preview — /dev not built"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deploy
        uses: actions/deploy-pages@v4
